[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comit"
version = "0.1.0"
description = "Communication-Inspired Tokenization for Structured Image Representations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }

dependencies = [
  "torch>=2.5.0",
  "torchvision>=0.20.0",

  "numpy>=1.23",
  "hydra-core>=1.3",
  "einops>=0.7",
  "timm>=1.0.0",
  "torchdiffeq>=0.2.3",
  "huggingface_hub>=0.20",

  "diffusers @ git+https://github.com/huggingface/diffusers.git@0874dd04dc1bb359053935109dc95483218b086f",

  "transformers>=4.38",
  "accelerate>=0.27",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.6.0",
  "pre-commit>=3.7.0",
]

notebook = [
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  "matplotlib>=3.7",
  "ipywidgets>=8.0",
  "mediapy>=1.2.0",
]

[tool.setuptools]
packages = ["comit"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
